server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: film-relay-backend
  
  datasource:
    url: jdbc:mysql://localhost:3306/film_relay?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
  
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# ??????
file:
  upload:
    path: ./uploads/
    allowed-types: jpg,jpeg,png,gif
    max-size: 10485760

# ????
logging:
  level:
    com.piaoliu: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n" 